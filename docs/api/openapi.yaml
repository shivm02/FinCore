openapi: 3.1.0
info:
  title: FinCore Financial Platform API (Simulated)
  version: 1.0.0
  description: |
    Simulated Digital Wallet, Double-Entry Ledger & Payment Processing API for Orion LMS Project 02.
    **NO REAL FUNDS OR REAL BANKING CREDENTIALS ARE USED.**

    ## Key Contracts
    - **Monetary Precision**: All monetary values are serialized as fixed-point decimal strings with 4 decimal places (e.g., `"250.0000"`), matching PostgreSQL `NUMERIC(19,4)`.
    - **Idempotency**: All mutating payment/transfer endpoints require an `Idempotency-Key` header (min 8 chars). Replays with identical payloads return the original result; mismatched payloads return `409 IDEMPOTENCY_CONFLICT`.
    - **Webhook Signatures**: Provider webhooks require `X-FinCore-Signature: t=<unix_ts>,v1=<hmac_sha256_hex>` verified with timing-safe comparison and a 300-second replay window.
    - **Error Envelope**: `{ "error": { "code": "STRING_CODE", "message": "Human-readable safe error", "requestId": "uuid" } }`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Docker / Development Sandbox
  - url: https://fincore.sim.local/api/v1
    description: Production-Like Simulated HTTPS Environment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    IdempotencyKey:
      description: Unique client-generated key (min 8 chars) preventing duplicate debits/credits on retry
      required: true
      schema:
        type: string
        minLength: 8
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: INSUFFICIENT_FUNDS }
            message: { type: string }
            requestId: { type: string, format: uuid }
    TransferRequest:
      type: object
      required: [sourceWalletId, destWalletId, amount]
      properties:
        sourceWalletId: { type: string, format: uuid }
        destWalletId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d+(\\.\\d{1,4})?$", example: "125.5000" }
        applyFee: { type: boolean, default: false }
        expectedSourceVersion: { type: integer, nullable: true }
        description: { type: string }
paths:
  /auth/register:
    post:
      summary: Register synthetic user account (scrypt hashed)
      responses:
        "201": { description: User created }
        "409": { description: Email already exists }
  /auth/login:
    post:
      summary: Authenticate credentials and initiate MFA simulation challenge
      responses:
        "200": { description: MFA challenge issued }
        "401": { description: Invalid credentials }
  /auth/mfa/verify:
    post:
      summary: Verify MFA code and issue JWT access + refresh tokens
      responses:
        "200": { description: Session created }
  /auth/reauth:
    post:
      summary: Re-authenticate password for sensitive actions (reversals, high-value ops)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Re-authentication window refreshed }
  /wallets:
    get:
      summary: List simulated wallets (scoped to own wallets for customers, all for ops/admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Wallet list }
    post:
      summary: Create simulated wallet with optional initial funding
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Wallet created }
  /beneficiaries:
    post:
      summary: Add transfer beneficiary
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Beneficiary added }
  /transfers:
    post:
      summary: Execute atomic double-entry transfer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201": { description: Transfer posted atomically }
        "200": { description: Idempotent replay of previously posted transfer }
        "409": { description: Idempotency conflict or optimistic lock conflict }
        "422": { description: Insufficient funds }
  /reversals:
    post:
      summary: Post offsetting reversal entries (Finance/Platform Admin + recent re-auth)
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Reversal posted; original entries remain immutable }
        "403": { description: Insufficient role or re-authentication required }
  /payment-intents:
    post:
      summary: Create sandbox payment intent
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Payment intent created }
  /webhooks/provider:
    post:
      summary: Receive HMAC-SHA256 signed payment provider webhook (deduplicated by event ID)
      parameters:
        - name: X-FinCore-Signature
          in: header
          required: true
          schema: { type: string, example: "t=1700000000,v1=abcdef..." }
      responses:
        "200": { description: Event processed or duplicate safely ignored }
        "401": { description: Invalid or expired webhook signature }
  /disputes:
    post:
      summary: Raise customer transaction dispute
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Dispute opened }
  /statements/{walletId}:
    get:
      summary: Generate simulated wallet statement summary
      security: [{ bearerAuth: [] }]
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Statement generated }
  /ledger/invariant:
    get:
      summary: Verify global & per-transaction double-entry balance invariant
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Invariant status }
  /audit-logs:
    get:
      summary: Retrieve immutable audit trail (Support/Ops/Finance/Admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated audit events }
